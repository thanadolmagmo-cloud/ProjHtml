<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าหลัก - จังหวัดหนองคาย</title>
    <!-- นำเข้าฟอนต์ Mitr และ Sarabun จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ตั้งค่า body ให้สูงเต็มหน้าจอ 100vh และซ่อน scrollbar */
        html, body {
            height: 100vh;
            overflow: hidden;
            font-family: 'Sarabun', sans-serif;
        }

        body {
            /* 
              หากมีไฟล์ภาพพื้นหลัง (เช่น bg.jpg) ให้เปิดใช้วรรคบรรทัดข้างล่างนี้ได้เลยครับ:
              background: url('bg.jpg') no-repeat center center fixed;
              background-size: cover;
            */
            background: linear-gradient(135deg, #4a2c11 0%, #a67c38 40%, #d4ab53 70%, #5c3818 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* เลเยอร์ประกายทองด้านหลัง */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(255, 235, 170, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 80% 20%, rgba(255, 220, 130, 0.25) 0%, transparent 40%);
            pointer-events: none;
        }

        /* การ์ดสไตล์ทอง หรูหรา คำนวณขนาดแบบยืดหยุ่นตามความสูงจอ */
        .card {
            background: rgba(43, 24, 9, 0.75);
            backdrop-filter: blur(10px);
            border: 2px solid #f3d078;
            border-radius: 20px;
            padding: 25px 35px;
            max-width: 1000px;
            width: 100%;
            max-height: calc(100vh - 40px); /* ความสูงไม่เกินหน้าจอ */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5), 
                        0 0 25px rgba(243, 208, 120, 0.3);
            position: relative;
            z-index: 1;
        }

        /* กล่องใส่รูป ยืดหดอัตโนมัติ ไม่ให้ล้นจอ */
        .img-container {
            width: 100%;
            flex: 1 1 auto;
            min-height: 0; /* สำคัญสำหรับ flexbox ให้หดตามจอได้ */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 14px;
            margin-bottom: 20px;
            border: 2px solid rgba(243, 208, 120, 0.6);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            background-color: rgba(0, 0, 0, 0.3);
        }

        /* รูปภาพแสดงเต็มภาพ ไม่ตัดขอบ และขยายได้ตามขนาดจอ */
        .img-container img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            transition: transform 0.4s ease;
        }

        .img-container img:hover {
            transform: scale(1.015);
        }

        h1 {
            font-family: 'Mitr', sans-serif;
            color: #ffe699;
            font-size: clamp(1.4rem, 2.5vw, 2rem); /* ปรับขนาดฟอนต์อัตโนมัติตามจอ */
            font-weight: 600;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7),
                         0 0 15px rgba(255, 230, 153, 0.4);
            flex-shrink: 0;
        }

        /* เส้นแบ่งสีทอง */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px auto;
            width: 40%;
            flex-shrink: 0;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid rgba(255, 230, 153, 0.5);
        }
        .divider span {
            padding: 0 15px;
            color: #ffe699;
            font-size: 0.9rem;
        }

        p {
            color: #fff4d6;
            font-size: clamp(1rem, 1.5vw, 1.25rem);
            line-height: 1.5;
            margin-bottom: 20px;
            font-weight: 300;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
            flex-shrink: 0;
        }

        /* ปุ่มกด */
        .btn-link {
            display: inline-block;
            background: linear-gradient(135deg, #ffe082 0%, #c69214 100%);
            color: #2b1809;
            padding: 10px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-family: 'Mitr', sans-serif;
            font-weight: 600;
            font-size: clamp(0.9rem, 1.2vw, 1.05rem);
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4),
                        0 0 15px rgba(255, 224, 130, 0.4);
            border: 1px solid #ffffff;
            flex-shrink: 0;
        }

        .btn-link:hover {
            background: linear-gradient(135deg, #ffffff 0%, #e6b800 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 230, 153, 0.6);
            color: #000;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="img-container">
            <img src="first.jpg" alt="Logo หนองคาย">
        </div>
        
        <h1>คำขวัญประจำจังหวัดหนองคาย</h1>
        
        <div class="divider">
            <span>❖</span>
        </div>
        
        <p>วีรกรรมปราบฮ่อ หลวงพ่อพระใส สะพานไทย-ลาว</p>
        
        <a href="login.html" class="btn-link">จัดการข้อมูล</a>
    </div>

</body>
</html>
